<!doctype html>
<html lang="zh-CN">
  <!-- 浏览器读取的页面文字编码、视口设置和标题。 -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#263f36" />
    <title>学生选课系统</title>
  </head>
  <body>
    <!-- Vue 应用挂载在这个节点，由 main.js 加载路由和页面。 -->
    <div id="app"></div>
    <!-- 页面先创建挂载节点，再加载 Vue 模块入口。Vite 构建正式包时将这里替换为编译后的资源路径。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
